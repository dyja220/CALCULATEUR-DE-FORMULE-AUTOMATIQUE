<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>The Miracle Lab — Miss Miracle Cosmetics</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#F5F3FF;font-family:system-ui,-apple-system,sans-serif;min-height:100vh}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none}
input[type=number]{-moz-appearance:textfield}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-thumb{background:#CBD5E1;border-radius:2px}
.hidden{display:none!important}


/* ACCESS SCREEN */
.access-screen{position:fixed;inset:0;background:linear-gradient(135deg,#4F46E5,#1E1B4B);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px}
.access-card{background:#fff;border-radius:24px;padding:36px 28px;width:100%;max-width:380px;box-shadow:0 20px 60px rgba(0,0,0,.4);text-align:center}
.access-logo{font-size:48px;margin-bottom:12px}
.access-brand{font-size:10px;letter-spacing:3px;color:#9CA3AF;text-transform:uppercase;margin-bottom:6px}
.access-title{font-size:24px;font-weight:800;color:#1B4F8A;margin-bottom:4px}
.access-subtitle{font-size:13px;color:#6B7280;margin-bottom:24px;line-height:1.5}
.access-input-wrap{position:relative;margin-bottom:14px}
.access-input{width:100%;border:2px solid #E5E7EB;border-radius:12px;padding:14px 16px;font-size:18px;font-weight:700;text-align:center;letter-spacing:4px;outline:none;font-family:inherit;transition:.2s;text-transform:uppercase}
.access-input:focus{border-color:#1B4F8A;box-shadow:0 0 0 3px rgba(27,79,138,.15)}
.access-input.error{border-color:#DC2626;animation:shake .3s}
.access-input.success{border-color:#16A34A}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.access-btn{width:100%;background:linear-gradient(135deg,#F97316,#EA580C);border:none;border-radius:12px;padding:14px;font-size:15px;font-weight:700;color:#0F2340;cursor:pointer;font-family:inherit;transition:.15s;margin-bottom:10px}
.access-btn:hover{opacity:.9}
.access-error{font-size:12px;color:#DC2626;margin-top:4px;display:none}
.access-hint{font-size:11px;color:#9CA3AF;margin-top:12px;line-height:1.5}
.access-sparkle{color:#F59E0B;font-size:14px}

/* HEADER */
.header{background:linear-gradient(135deg,#4F46E5,#3730A3);box-shadow:0 4px 24px rgba(0,0,0,.25)}
.header-inner{max-width:920px;margin:0 auto;padding:16px 14px 0}
.header-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.brand-sub{font-size:10px;letter-spacing:3px;color:rgba(255,255,255,.4);text-transform:uppercase;margin-bottom:4px}
.formula-name{font-size:19px;font-weight:800;color:#fff;cursor:pointer;display:flex;align-items:center;gap:7px}
.formula-input{background:transparent;border:none;border-bottom:2px solid rgba(255,255,255,.5);outline:none;color:#fff;font-size:19px;font-weight:800;width:260px;padding:2px 0;font-family:inherit}
.header-controls{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.lot-box{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:10px;padding:6px 11px;display:flex;align-items:center;gap:7px}
.lot-label{font-size:10px;color:rgba(255,255,255,.5);letter-spacing:1.5px;text-transform:uppercase}
.lot-input{background:transparent;border:none;outline:none;color:#fff;font-size:17px;font-weight:800;width:60px;text-align:right;font-family:inherit}
.lot-input::placeholder{color:rgba(255,255,255,.3);font-weight:400}
.lot-unit{color:rgba(255,255,255,.4);font-size:12px}
.btn{border:none;border-radius:9px;padding:8px 13px;cursor:pointer;font-size:12px;font-weight:600;font-family:inherit;transition:.15s}
.btn-lib{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff}
.btn-save{background:linear-gradient(135deg,#EC4899,#DB2777);color:#fff}
.btn-saved{background:linear-gradient(135deg,#059669,#047857);color:#fff}
.btn-export{background:linear-gradient(135deg,#F97316,#EA580C);color:#fff}
.btn-reset{background:transparent;border:1px solid rgba(255,255,255,.15);color:rgba(255,255,255,.4)}

/* FORMULA TYPE SELECTOR */
.type-bar{display:flex;gap:6px;flex-wrap:wrap;padding:10px 14px;background:rgba(0,0,0,.15);border-radius:0}
.type-btn{border:none;border-radius:20px;padding:6px 13px;cursor:pointer;font-size:12px;font-weight:600;font-family:inherit;background:rgba(255,255,255,.1);color:rgba(255,255,255,.6);transition:.15s;white-space:nowrap}
.type-btn.active{background:#F97316;color:#fff}

/* PROGRESS */
.progress-bar-wrap{background:rgba(255,255,255,.07);border-radius:12px 12px 0 0;padding:11px 14px}
.progress-legend{display:flex;justify-content:space-between;margin-bottom:6px;align-items:center;flex-wrap:wrap;gap:5px}
.progress-dots{display:flex;gap:10px;flex-wrap:wrap}
.progress-dot{font-size:11px;color:rgba(255,255,255,.4);display:flex;align-items:center;gap:4px}
.dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.progress-status{font-size:11px;font-weight:700}
.progress-track{height:7px;background:rgba(255,255,255,.08);border-radius:4px;display:flex;overflow:hidden}
.progress-seg{height:100%;transition:width .3s;flex-shrink:0}
.progress-over{height:100%;flex:1;background:repeating-linear-gradient(45deg,#DC2626 0,#DC2626 4px,#FCA5A5 4px,#FCA5A5 8px)}

/* PH BAR */
.ph-bar{background:rgba(255,255,255,.07);padding:8px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ph-label{font-size:10px;color:rgba(255,255,255,.5);letter-spacing:2px;text-transform:uppercase;flex-shrink:0}
.ph-track{flex:1;min-width:120px;height:10px;border-radius:5px;background:linear-gradient(90deg,#DC2626 0%,#F59E0B 20%,#84CC16 40%,#22C55E 55%,#0891B2 70%,#7C3AED 85%,#DC2626 100%);position:relative;overflow:visible}
.ph-indicator{position:absolute;top:-4px;width:18px;height:18px;border-radius:50%;background:#fff;border:3px solid #4F46E5;transform:translateX(-50%);transition:left .4s;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.ph-value{font-size:14px;font-weight:800;color:#fff;min-width:40px;text-align:center}
.ph-target{font-size:10px;color:rgba(255,255,255,.45)}

/* ERROR */
.error-banner{max-width:920px;margin:0 auto;background:#FEE2E2;border-left:5px solid #DC2626;padding:11px 18px;display:flex;gap:10px;align-items:center}
.error-banner b{font-size:13px;color:#991B1B;display:block}
.error-banner span{font-size:12px;color:#B91C1C}

/* CONTENT */
.content{max-width:920px;margin:0 auto;padding:14px 10px 40px;display:flex;flex-direction:column;gap:13px}

/* PHASE CARD */
.phase-card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 1px 6px rgba(0,0,0,.06)}
.phase-header{padding:10px 15px;display:flex;align-items:center;justify-content:space-between}
.phase-title{display:flex;align-items:center;gap:7px}
.phase-icon{font-size:15px}
.phase-label{font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase}
.phase-total{display:flex;gap:14px;align-items:center}
.phase-pct{font-size:19px;font-weight:900}
.phase-pct-unit{font-size:11px;color:#9CA3AF}
.phase-grams{font-size:12px;color:#9CA3AF;min-width:50px;text-align:right}

/* COL HEADERS */
.col-headers{display:grid;grid-template-columns:minmax(0,1fr) 62px 68px 28px;gap:5px;padding:6px 13px 3px;border-bottom:1px solid #F3F4F6}
.col-h{font-size:10px;font-weight:700;letter-spacing:1.5px;color:#CBD5E1;text-transform:uppercase}
.col-h.right{text-align:right}

/* WATER ROW */
.water-row{display:grid;grid-template-columns:minmax(0,1fr) 62px 68px 28px;gap:5px;padding:4px 13px;align-items:center;border-bottom:1px solid #E0F7FA;background:#F0FDFF}
.water-label{display:flex;align-items:center;gap:6px;padding:4px 8px;background:#E0F7FA;border:1.5px solid #67E8F9;border-radius:8px;min-height:30px}
.water-name{font-size:12px;font-weight:600;color:#0891B2;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.water-badge{font-size:9px;background:#0891B2;color:#fff;padding:2px 4px;border-radius:3px;font-weight:700;flex-shrink:0}
.water-pct{text-align:right;font-size:13px;font-weight:700}
.water-g{text-align:right;font-size:11px;font-weight:600;color:#374151;white-space:nowrap}

/* INGREDIENT ROW */
.ing-row{display:grid;grid-template-columns:minmax(0,1fr) 62px 68px 28px;gap:5px;padding:4px 13px;align-items:center}

/* LIMIT WARNING */
.limit-warn{grid-column:1/-1;font-size:10px;padding:2px 8px 4px;color:#D97706;display:flex;align-items:center;gap:4px}
.limit-err{color:#DC2626}

/* DROPDOWN */
.dd-wrap{position:relative;min-width:0}
.dd-trigger{display:flex;align-items:center;gap:5px;cursor:pointer;padding:4px 8px;border:1.5px solid #E5E7EB;border-radius:7px;font-size:12px;color:#9CA3AF;min-height:30px;background:#FAFAFA;user-select:none;-webkit-user-select:none;width:100%;font-family:inherit;transition:.15s}
.dd-trigger.has-value{color:#111827;font-weight:500}
.dd-trigger.warn-border{border-color:#F59E0B!important}
.dd-trigger.err-border{border-color:#DC2626!important}
.dd-arrow{font-size:8px;flex-shrink:0}
.dd-text{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dd-panel{position:fixed;z-index:9999;background:#fff;border-radius:10px;box-shadow:0 8px 32px rgba(0,0,0,.18);overflow:hidden}
.dd-search-wrap{padding:6px 7px;border-bottom:2px solid #eee}
.dd-search{width:100%;border:none;border-radius:6px;padding:5px 8px;font-size:16px;outline:none;background:#F9FAFB;font-family:inherit}
.dd-group-header{padding:6px 12px;font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;background:#F8FAFC;color:#94A3B8;border-bottom:1px solid #F1F5F9}
.dd-list{max-height:240px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.dd-item{padding:9px 12px;cursor:pointer;font-size:13px;color:#111827;border-bottom:1px solid #F7F7F7;display:flex;align-items:center;gap:6px}
.dd-item:hover,.dd-item.selected{background:#F0FDFF}
.dd-item-limit{font-size:10px;color:#9CA3AF;margin-left:auto;flex-shrink:0}
.dd-empty{padding:14px;text-align:center;color:#9CA3AF;font-size:13px}
.dd-add{padding:9px 12px;cursor:pointer;font-size:13px;font-weight:600;border-top:1px solid #eee}
.dd-clear{padding:8px 12px;cursor:pointer;font-size:12px;color:#9CA3AF;font-style:italic;border-bottom:1px solid #F0F0F0}

/* PCT INPUT */
.pct-wrap{display:flex;align-items:center;justify-content:flex-end;gap:2px}
.pct-input{width:48px;text-align:right;border:1.5px solid #E5E7EB;border-radius:7px;padding:4px 4px;font-size:15px;font-weight:700;outline:none;background:#fff;font-family:inherit;transition:.15s;color:#374151}
.pct-input::placeholder{color:#CBD5E1;font-weight:400}
.pct-input::placeholder{color:#CBD5E1;font-weight:400}
.pct-unit{font-size:10px;color:#9CA3AF}
.grams-cell{text-align:right;font-size:11px;font-weight:600;color:#E5E7EB;white-space:nowrap}
.grams-cell.active{color:#374151}
.del-btn{background:transparent;border:none;cursor:pointer;color:#E2E8F0;font-size:15px;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:.15s;font-family:inherit}
.del-btn:hover{background:#FEE2E2;color:#DC2626}
.add-row{padding:6px 13px 11px}
.add-btn{width:100%;border-radius:8px;padding:7px;font-size:12px;font-weight:600;letter-spacing:.5px;cursor:pointer;font-family:inherit;transition:.15s}

/* PH CARD */
.ph-card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 1px 6px rgba(0,0,0,.06);border:2px solid #C7D2FE}
.ph-card-header{background:linear-gradient(90deg,#EEF2FF,#C7D2FE);padding:10px 15px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #E0E7FF}
.ph-card-title{font-size:11px;font-weight:700;letter-spacing:2px;color:#4F46E5;text-transform:uppercase;display:flex;align-items:center;gap:6px}
.ph-card-body{padding:14px 15px;display:flex;flex-direction:column;gap:10px}
.ph-range-track{height:16px;border-radius:8px;background:linear-gradient(90deg,#DC2626 0%,#F59E0B 15%,#84CC16 35%,#22C55E 50%,#0891B2 70%,#7C3AED 90%,#DC2626 100%);position:relative}
.ph-range-indicator{position:absolute;top:-4px;width:24px;height:24px;border-radius:50%;background:#fff;border:3px solid #4F46E5;transform:translateX(-50%);transition:left .4s;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.ph-scale{display:flex;justify-content:space-between;margin-top:4px;font-size:10px;color:#9CA3AF}
.ph-info{display:flex;gap:10px;flex-wrap:wrap}
.ph-info-box{flex:1;min-width:120px;background:#F8FAFC;border-radius:8px;padding:8px 10px;border:1px solid #E2E8F0}
.ph-info-label{font-size:10px;color:#6B7280;letter-spacing:1px;text-transform:uppercase;margin-bottom:2px}
.ph-info-value{font-size:14px;font-weight:700;color:#111827}
.ph-alert{background:#FEF9C3;border:1px solid #FDE047;border-radius:8px;padding:8px 10px;font-size:12px;color:#854D0E;display:flex;gap:6px;align-items:center}
.ph-ok{background:#DCFCE7;border:1px solid #86EFAC;border-radius:8px;padding:8px 10px;font-size:12px;color:#14532D;display:flex;gap:6px;align-items:center}

/* SUMMARY */
.summary{border-radius:14px;padding:16px 18px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;box-shadow:0 2px 12px rgba(0,0,0,.06)}
.summary-phases{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.summary-phase{text-align:center;min-width:48px}
.summary-phase-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;margin-bottom:1px}
.summary-phase-pct{font-size:17px;font-weight:900}
.summary-phase-g{font-size:10px;color:#9CA3AF}
.summary-total{text-align:center}
.summary-status{font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;margin-bottom:3px}
.summary-big{font-size:32px;font-weight:900;line-height:1}
.summary-weight{font-size:11px;color:#6B7280;margin-top:2px}

/* SAVED FORMULAS */
.saved-modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:1000;display:flex;align-items:flex-end;justify-content:center}
.saved-modal{background:#fff;border-radius:20px 20px 0 0;width:100%;max-width:600px;max-height:85vh;display:flex;flex-direction:column;box-shadow:0 -10px 40px rgba(0,0,0,.2)}
.saved-header{background:linear-gradient(135deg,#EC4899,#DB2777);padding:18px 18px 14px;color:#fff;border-radius:20px 20px 0 0;display:flex;justify-content:space-between;align-items:flex-start}
.saved-title{font-size:16px;font-weight:800}
.saved-sub{font-size:11px;color:rgba(255,255,255,.55);margin-top:2px}
.saved-list{overflow-y:auto;flex:1;padding:8px}
.saved-item{background:#F8FAFC;border-radius:12px;padding:12px 14px;margin-bottom:8px;cursor:pointer;border:1.5px solid #E2E8F0;transition:.15s}
.saved-item:hover{border-color:#7C3AED;background:#F5F3FF}
.saved-item-name{font-size:14px;font-weight:700;color:#111827}
.saved-item-meta{font-size:11px;color:#6B7280;margin-top:2px;display:flex;gap:8px}
.saved-item-type{font-size:10px;background:#E0E7FF;color:#4F46E5;padding:2px 7px;border-radius:20px;font-weight:600}
.saved-item-actions{display:flex;gap:6px;margin-top:8px}
.btn-load{background:#7C3AED;color:#fff;border:none;border-radius:7px;padding:5px 12px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit}
.btn-del-saved{background:transparent;color:#DC2626;border:1px solid #FECACA;border-radius:7px;padding:5px 10px;font-size:12px;cursor:pointer;font-family:inherit}
.saved-empty{padding:40px;text-align:center;color:#9CA3AF;font-size:14px}
.btn-save-current{background:linear-gradient(135deg,#EC4899,#DB2777);color:#fff;border:none;border-radius:10px;padding:11px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;margin:0 8px 10px}

/* LIBRARY MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:1000;display:flex;align-items:center;justify-content:center;padding:14px}
.modal-box{background:#fff;border-radius:20px;width:100%;max-width:620px;max-height:88vh;display:flex;flex-direction:column;box-shadow:0 40px 100px rgba(0,0,0,.3);overflow:hidden}
.modal-header{background:linear-gradient(135deg,#4F46E5,#3730A3);padding:18px 18px 0;color:#fff}
.modal-header-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:11px}
.modal-subtitle{font-size:10px;letter-spacing:3px;color:rgba(255,255,255,.45);text-transform:uppercase;margin-bottom:4px}
.modal-title{font-size:17px;font-weight:800}
.modal-count{font-size:11px;color:rgba(255,255,255,.45);margin-top:2px}
.modal-btns{display:flex;gap:7px;align-items:center}
.btn-add-lib{background:linear-gradient(135deg,#F97316,#EA580C);border:none;border-radius:8px;padding:6px 12px;color:#fff;cursor:pointer;font-size:12px;font-weight:700;font-family:inherit}
.btn-close{background:rgba(255,255,255,.15);border:none;border-radius:50%;width:30px;height:30px;color:#fff;cursor:pointer;font-size:17px;display:flex;align-items:center;justify-content:center;font-family:inherit}
.modal-search{width:100%;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.1);border-radius:9px;padding:8px 12px;color:#fff;font-size:13px;outline:none;font-family:inherit}
.modal-search::placeholder{color:rgba(255,255,255,.4)}
.modal-tabs{display:flex;margin-top:11px}
.modal-tab{flex:1;padding:8px 5px;border:none;cursor:pointer;background:transparent;font-size:11px;font-weight:500;color:rgba(255,255,255,.55);font-family:inherit;transition:.15s}
.modal-tab.active{background:#fff;border-radius:9px 9px 0 0;font-weight:700}
.lib-group-header{padding:7px 14px;font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;border-bottom:1px solid #F1F5F9;display:flex;align-items:center;gap:6px}
.lib-list{overflow-y:auto;flex:1}
.lib-item{display:flex;align-items:center;padding:9px 16px;border-bottom:1px solid #F9FAFB}
.lib-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-right:11px}
.lib-info{flex:1}
.lib-name{font-size:13px;font-weight:600;color:#111827;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.lib-note{font-size:11px;color:#9CA3AF;margin-top:1px}
.lib-limit{font-size:10px;background:#FEF3C7;color:#92400E;padding:2px 6px;border-radius:10px;font-weight:600;flex-shrink:0}
.lib-badge-custom{font-size:9px;background:#DCFCE7;color:#14532D;padding:2px 6px;border-radius:20px;font-weight:700}
.lib-phase-badge{font-size:10px;padding:2px 7px;border-radius:20px;font-weight:700;margin-right:7px;flex-shrink:0}
.del-lib-btn{background:transparent;border:none;cursor:pointer;color:#D1D5DB;font-size:14px;padding:2px 4px;border-radius:4px;transition:.15s;font-family:inherit;flex-shrink:0}
.del-lib-btn:hover{color:#DC2626}
.add-form{background:#FFFBEB;border-bottom:2px solid #FCD34D;padding:13px 15px;display:flex;flex-direction:column;gap:8px}
.add-form-title{font-size:11px;font-weight:700;color:#78350F;letter-spacing:1px;text-transform:uppercase}
.add-form-row{display:flex;gap:6px;flex-wrap:wrap}
.add-select{border:1.5px solid #FCD34D;border-radius:8px;padding:6px 8px;font-size:12px;outline:none;background:#fff;font-weight:600;color:#374151;cursor:pointer;font-family:inherit}
.add-input{flex:1;min-width:120px;border:1.5px solid #FCD34D;border-radius:8px;padding:6px 8px;font-size:13px;outline:none;font-family:inherit}
.add-form-btns{display:flex;gap:6px}
.btn-confirm{border:none;border-radius:8px;padding:6px 14px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}
.btn-cancel{background:transparent;border:1px solid #E5E7EB;border-radius:8px;padding:6px 11px;font-size:13px;color:#6B7280;cursor:pointer;font-family:inherit}

/* TOAST */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 20px;border-radius:10px;font-size:13px;font-weight:600;box-shadow:0 8px 32px rgba(0,0,0,.3);z-index:2000;white-space:nowrap}
</style>
</head>
<body>
<div id="app"></div>
<script>

  for(const [phase, groups] of Object.entries(LIBRARY)){

}

function sumPhase(rows){ return rows.reduce((a,r)=>a+(parseFloat(r.pct)||0),0); }
function nonWater(){
  return Object.values(state.phases).reduce((a,rows)=>a+sumPhase(rows),0);
}
function effectiveWeight(){ return state.totalWeight||1000; }
function waterPct(){
  const type = FORMULA_TYPES[state.formulaType];
  if(!type.hasWater) return 0;
  return Math.max(0, parseFloat((100-nonWater()).toFixed(4)));
}
function totalPct(){ return nonWater()+waterPct(); }
function isOver(){ return nonWater()>100.001; }
function isOk(){ return !isOver()&&Math.abs(totalPct()-100)<0.01; }
function trunc(s,n=32){ if(!s)return""; return s.length<=n?s:s.slice(0,n)+"…"; }

// pH estimation
function estimatePH(){
  const type = FORMULA_TYPES[state.formulaType];
  if(!type.hasWater) return null;
  let ph = 6.5;
  for(const rows of Object.values(state.phases)){
    for(const row of rows){
      if(!row.name) continue;
      const data = getIngredientData(row.name);
      const pct = parseFloat(row.pct)||0;
      if(!pct) continue;
      // Acide citrique — très puissant, 0.2% suffit à descendre ~1.5 unités
      if(row.name.includes("Acide Citrique")) ph -= pct * 7;
      // Acide lactique — moins fort que citrique
      else if(row.name.includes("Acide Lactique")) ph -= pct * 4;
      // Acide benzoïque / sorbique — encore plus doux
      else if(row.name.includes("Acide Benzoïque")||row.name.includes("Acide Sorbique")) ph -= pct * 2;
      // Autres ajusteurs
      else if(data && data.phNote && data.phNote.includes("Baisse")) ph -= pct * 1.5;
      // Conservateurs acidifient légèrement
      else if(data && data.group==="Conservateurs") ph -= pct * 0.15;
    }
  }
  return Math.max(2.5, Math.min(9.0, parseFloat(ph.toFixed(1))));
}

function getPhStatus(){
  const ph = estimatePH();
  if(ph===null) return null;
  const type = FORMULA_TYPES[state.formulaType];
  if(!type.phTarget) return {ph, ok:true, msg:"Pas de cible pH pour ce type"};
  const [min,max] = type.phTarget;
  if(ph>=min && ph<=max) return {ph, ok:true, msg:`pH optimal pour ${FORMULA_TYPES[state.formulaType].label}`};
  if(ph<min) return {ph, ok:false, msg:`pH trop bas (${ph}) — cible : ${min}-${max}. Ajouter un tampon basique.`};
  return {ph, ok:false, msg:`pH trop élevé (${ph}) — cible : ${min}-${max}. Ajouter Acide Citrique ou Lactique.`};
}

function checkLimit(name, pct){
  if(!name || !pct || pct==="") return null;
  const val = parseFloat(pct);
  if(isNaN(val)) return null;
  const data = getIngredientData(name);
  if(!data) return null;
  if(data.maxPct && val > data.maxPct) return {type:"error", msg: data.warnMsg||`Max recommandé : ${data.maxPct}%`};
  if(data.minPct && val < data.minPct && val>0) return {type:"warn", msg: `Min recommandé : ${data.minPct}%`};
  if(data.maxPct && val > data.maxPct*0.9 && val <= data.maxPct) return {type:"warn", msg:`Proche du max (${data.maxPct}%)`};
  return null;
}

function checkCompatibility(){
  const allNames=Object.values(state.phases).flat().map(r=>r.name).filter(Boolean);
  if(allNames.length<2) return [];
  const alerts=[];
  const hasAcid=allNames.some(n=>["Acide Citrique","Acide Lactique","Acide Benzoïque","Acide Sorbique"].includes(n));
  const ph=estimatePH();
  for(const rule of COMPAT_RULES){
    if(rule.groupB[0]==="__NO_ACID__"){
      if(allNames.some(n=>rule.groupA.includes(n))&&!hasAcid)
        alerts.push({type:rule.type,msg:rule.msg});
      continue;
    }
    if(rule.groupB[0]==="__HIGH_PH__"){
      if(allNames.some(n=>rule.groupA.includes(n))&&ph&&ph>7)
        alerts.push({type:rule.type,msg:rule.msg});
      continue;
    }
    const hasA=allNames.some(n=>rule.groupA.includes(n));
    const hasB=allNames.some(n=>rule.groupB.includes(n));
    if(hasA&&hasB&&!alerts.find(a=>a.msg===rule.msg))
      alerts.push({type:rule.type,msg:rule.msg});
  }
  return alerts;
}

  if(state.openDropdown===ddKey){state.openDropdown=null;render();return;}

  state.dropPos={top:rect.bottom+3,left:rect.left,width:rect.width};
  state.ddSearch="";

  trackDD();

function trackDD(){
  if(rafId) cancelAnimationFrame(rafId);
  if(!state.openDropdown) return;
  rafId=requestAnimationFrame(()=>{
    const trigger=document.querySelector(`[data-ddkey="${state.openDropdown}"]`);
    const panel=document.getElementById("dd-panel");
    if(trigger&&panel){
      const rect=trigger.getBoundingClientRect();
      panel.style.top=rect.bottom+3+"px";
      panel.style.left=rect.left+"px";
      panel.style.width=rect.width+"px";
    }
    trackDD();
  });
}

function saveCurrentFormula(){
  const saved = {
    id: Date.now(),
    name: state.formulaName,
    type: state.formulaType,
    totalWeight: state.totalWeight,
    phases: deepClone(state.phases),
    date: new Date().toLocaleDateString("fr-FR"),
  };
  state.savedFormulas.unshift(saved);
  saveToDisk();
  showToast("✓ Formule enregistrée !");
}
function loadFormula(id){
  const f=state.savedFormulas.find(s=>s.id===id);
  if(!f) return;
  state.formulaName=f.name;
  state.formulaType=f.type;
  state.totalWeight=f.totalWeight;
  state.phases=deepClone(f.phases);
  state.showSaved=false;
  render();
  showToast("✓ Formule chargée !");
}
function deleteFormula(id){
  state.savedFormulas=state.savedFormulas.filter(s=>s.id!==id);
  saveToDisk();
  render();
}

function exportCSV(){
  const w=waterPct(), tw=effectiveWeight();
  let lines=[["Phase","Ingrédient","Pourcentage (%)","Poids (g)"]];
  if(FORMULA_TYPES[state.formulaType].hasWater) lines.push(["Aqueuse","Eau Distillée",w.toFixed(2),((tw*w)/100).toFixed(1)]);
  for(const [k,rows] of Object.entries(state.phases)){
    rows.filter(r=>r.name).forEach(r=>{
      lines.push([PHASES[k].label,r.name,r.pct||"0",((tw*(parseFloat(r.pct)||0))/100).toFixed(1)]);
    });
  }
  lines.push(["","TOTAL","100.00",tw]);
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([lines.map(l=>l.join(",")).join("\n")],{type:"text/csv"}));
  a.download=state.formulaName.replace(/\s+/g,"_")+".csv";
  a.click();
  showToast("✓ Export CSV réussi");
}

function addToLibrary(){
  const n=state.libNewName.trim();
  if(!n) return;
  const ph=state.libSearch?state.libNewPhase:state.libTab;
  const groups=state.library[ph];
  const groupKey=state.libNewGroup||(ph==="AQUEUSE"?"Actifs Capillaires":ph==="HUILEUSE"?"Huiles Végétales":"Actifs & Vitamines");
  if(!groups[groupKey]) groups[groupKey]=[];
  if(Object.values(groups).flat().some(i=>i.name.toLowerCase()===n.toLowerCase())) return;
  groups[groupKey].push({name:n, note:state.libNewNote.trim()||"Ingrédient personnalisé"});
  state.libNewName=""; state.libNewNote=""; state.libAdding=false;
  render();
}

function deleteFromLibrary(phase,name){
  const groups=state.library[phase];
  for(const g of Object.keys(groups)){
    groups[g]=groups[g].filter(i=>i.name!==name);
  }
  render();
}

  const ph=PHASES[state.libTab];

  const groups=state.library[state.libTab];

  let displayGroups={};
  if(q){
    for(const [phase,pgroups] of Object.entries(state.library)){
      for(const [g,items] of Object.entries(pgroups)){
        const filtered=items.filter(i=>i.name.toLowerCase().includes(q)||i.note.toLowerCase().includes(q));
        if(filtered.length>0){
          const label=`${PHASES[phase].icon} ${g}`;
          displayGroups[label]=filtered.map(i=>({...i,phase}));
        }
      }
    }
  } else {
    for(const [g,items] of Object.entries(groups)){
      displayGroups[g]=items.map(i=>({...i,phase:state.libTab}));
    }
  }

  const total=Object.values(state.library).flatMap(pg=>Object.values(pg)).flat().length;
  const initNames=new Set(Object.values(LIBRARY).flatMap(pg=>Object.values(pg)).flat().map(i=>i.name));

  return `

          </div>
          <div class="modal-btns">
            <button class="btn-add-lib" id="lib-add-btn">+ Ajouter</button>
            <button class="btn-close" id="lib-close">×</button>
          </div>
        </div>
        <input class="modal-search" id="lib-search" placeholder="Rechercher dans toutes les phases…" value="${esc(state.libSearch)}"/>
        ${!state.libSearch?`
        <div class="modal-tabs">
          ${Object.entries(PHASES).map(([k,p])=>`
            <button class="modal-tab ${state.libTab===k?"active":""}" data-libtab="${k}"
              style="${state.libTab===k?"color:"+p.accent:""}">
              ${p.icon} ${p.label.replace("Phase ","")}
            </button>`).join("")}
        </div>`:`<div style="height:10px"></div>`}
      </div>

      ${state.libAdding?`
      <div class="add-form">
        <div class="add-form-title">✨ Nouvel ingrédient</div>
        <div class="add-form-row">
          <select class="add-select" id="lib-new-phase">
            ${Object.entries(PHASES).map(([k,p])=>`<option value="${k}" ${state.libNewPhase===k?"selected":""}>${p.icon} ${p.label}</option>`).join("")}
          </select>
          <input class="add-input" id="lib-new-name" placeholder="Nom *" value="${esc(state.libNewName)}"/>
        </div>
        <input class="add-input" id="lib-new-note" placeholder="Description / propriétés" value="${esc(state.libNewNote)}"/>
        <div class="add-form-btns">
          <button class="btn-confirm" id="lib-confirm" style="background:${state.libNewName.trim()?"linear-gradient(135deg,#059669,#047857)":"#E5E7EB"};color:${state.libNewName.trim()?"#fff":"#9CA3AF"}">
            Ajouter à la bibliothèque
          </button>
          <button class="btn-cancel" id="lib-cancel">Annuler</button>
        </div>
      </div>`:""}

      <div class="lib-list">
        ${Object.entries(displayGroups).map(([groupName,items])=>`
          <div class="lib-group-header" style="background:${q?"#F8FAFC":ph.light};color:${q?"#94A3B8":ph.accent}">
            ${groupName} <span style="font-weight:400;opacity:.6">(${items.length})</span>
          </div>
          ${items.map((ing,i)=>{
            const p=PHASES[ing.phase];
            const isCustom=!initNames.has(ing.name);
            return `
            <div class="lib-item" style="background:${i%2===0?"#fff":"#FAFAFA"}">
              <div class="lib-dot" style="background:${p.color}"></div>
              <div class="lib-info">
                <div class="lib-name">
                  ${esc(ing.name)}
                  ${isCustom?`<span class="lib-badge-custom">PERSO</span>`:""}
                  ${ing.maxPct?`<span class="lib-limit">max ${ing.maxPct}%</span>`:""}
                </div>
                <div class="lib-note">${esc(ing.note)}</div>
              </div>
              ${q?`<div class="lib-phase-badge" style="background:${p.light};color:${p.accent}">${p.icon} ${p.short}</div>`:""}
              <button class="del-lib-btn" data-libphase="${ing.phase}" data-libname="${esc(ing.name)}">🗑</button>
            </div>`;
          }).join("")}
        `).join("")}
        ${Object.keys(displayGroups).length===0?`<div style="padding:40px;text-align:center;color:#9CA3AF;font-size:14px">Aucun résultat</div>`:""}
      </div>
    </div>
  </div>`;
}

function esc(s){ return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

// ═══════════════════════════════════════════════════════════════
// EVENTS
// ═══════════════════════════════════════════════════════════════
function bindEvents(){
  // Name
  document.getElementById("formula-name-click")?.addEventListener("click",()=>{state.editingName=true;render();setTimeout(()=>document.getElementById("formula-name-input")?.focus(),50);});
  const ni=document.getElementById("formula-name-input");
  if(ni){
    ni.addEventListener("blur",e=>{state.formulaName=e.target.value;state.editingName=false;render();});
    ni.addEventListener("keydown",e=>{if(e.key==="Enter"){state.formulaName=e.target.value;state.editingName=false;render();}});
  }
  // Lot — no render while typing
  const lotEl=document.getElementById("lot-input");
  if(lotEl){
    lotEl.addEventListener("input",e=>{state.totalWeight=parseFloat(e.target.value)||0;});
    lotEl.addEventListener("blur",()=>render());
    lotEl.addEventListener("keydown",e=>{if(e.key==="Enter") e.target.blur();});
  }
  // Type buttons
  document.querySelectorAll(".type-btn").forEach(el=>el.addEventListener("click",e=>setFormulaType(e.currentTarget.dataset.type)));
  // Header btns
  document.getElementById("btn-lib")?.addEventListener("click",()=>{state.showLibrary=true;render();});
  document.getElementById("btn-save")?.addEventListener("click",saveCurrentFormula);
  document.getElementById("btn-show-saved")?.addEventListener("click",()=>{state.showSaved=true;render();});
  document.getElementById("btn-export")?.addEventListener("click",exportCSV);
  document.getElementById("btn-reset")?.addEventListener("click",()=>{state.phases=defaultPhases(state.formulaType);state.totalWeight=FORMULA_TYPES[state.formulaType].defaultWeight;showToast("Formule réinitialisée");});
  // Pct inputs — update state silently while typing, render only on blur/enter
  document.querySelectorAll(".pct-input").forEach(el=>{
    el.addEventListener("input",e=>{
      updateRow(e.target.dataset.phase,parseInt(e.target.dataset.id),"pct",e.target.value,true);
      // Update only the grams display inline without full re-render
      const tw=effectiveWeight();
      const val=parseFloat(e.target.value)||0;
      const row=e.target.closest(".ing-row");
      if(row){
        const gc=row.querySelector(".grams-cell");
        if(gc){
          gc.textContent=val>0?((tw*val)/100).toFixed(1)+"g":"—";
          gc.className="grams-cell"+(val>0?" active":"");
        }
      }
    });
    el.addEventListener("blur",e=>{
      updateRow(e.target.dataset.phase,parseInt(e.target.dataset.id),"pct",e.target.value);
    });
    el.addEventListener("keydown",e=>{
      if(e.key==="Enter") e.target.blur();
    });
  });
  // Delete row
  document.querySelectorAll(".del-btn").forEach(el=>el.addEventListener("click",e=>removeRow(e.currentTarget.dataset.phase,parseInt(e.currentTarget.dataset.id))));
  // Add row
  document.querySelectorAll(".add-btn").forEach(el=>el.addEventListener("click",e=>addRow(e.currentTarget.dataset.phase)));
  // Dropdowns
  document.querySelectorAll(".dd-trigger").forEach(el=>{
    const open=()=>openDD(el.dataset.ddkey,el);
    el.addEventListener("mousedown",e=>{e.preventDefault();open();});
    el.addEventListener("touchend",e=>{e.preventDefault();open();});
  });
  // DD panel
  const ddPanel=document.getElementById("dd-panel");
  if(ddPanel){
    const dds=document.getElementById("dd-search-input");
    if(dds){
      dds.addEventListener("input",e=>{
        state.ddSearch=e.target.value;
        // filter list inline without full re-render
        const q=e.target.value.toLowerCase();
        const pk=state.openDropdown.split("-")[0];
        const groups=state.library[pk];
        const panel=document.getElementById("dd-panel");
        if(!panel) return;
        const list=panel.querySelector(".dd-list");
        if(!list) return;
        // just re-render the panel content only
        const id=state.openDropdown.split("-")[1];
        const curRow=state.phases[pk].find(r=>r.id==id);
        const curVal=curRow?curRow.name:"";
        const ph=PHASES[pk];
        let html=`<div class="dd-clear" id="dd-clear">— Vider</div>`;
        for(const [groupName,ingList] of Object.entries(groups)){
          const filtered=q?ingList.filter(i=>i.name.toLowerCase().includes(q)):ingList;
          if(filtered.length>0){
            html+=`<div class="dd-group-header">${groupName}</div>`;
            filtered.forEach(ing=>{
              html+=`<div class="dd-item ${curVal===ing.name?"selected":""}" data-ingname="${esc(ing.name)}">
                ${curVal===ing.name?`<span style="color:${ph.color}">✓</span>`:""}
                <span>${esc(ing.name)}</span>
                ${ing.maxPct?`<span class="dd-item-limit">max ${ing.maxPct}%</span>`:""}
              </div>`;
            });
          }
        }
        if(!Object.values(groups).some(arr=>arr.some(i=>i.name.toLowerCase().includes(q)))){
          html+=`<div class="dd-empty">Aucun résultat</div>`;
        }
        if(e.target.value.trim()&&!Object.values(groups).flat().some(i=>i.name.toLowerCase()===e.target.value.trim().toLowerCase())){
          html+=`<div class="dd-add" style="color:${ph.accent};background:${ph.light};border-top:1px solid ${ph.mid}" id="dd-add-custom">+ Ajouter « ${esc(e.target.value.trim())} »</div>`;
        }
        list.innerHTML=html;
        // rebind items
        list.querySelectorAll(".dd-item").forEach(el=>{
          const sel=()=>{const [ppk,iid]=state.openDropdown.split("-");selectIngredient(ppk,iid,el.dataset.ingname);};
          el.addEventListener("mousedown",ev=>{ev.preventDefault();sel();});
          el.addEventListener("touchend",ev=>{ev.preventDefault();sel();});
        });
        list.querySelector(".dd-clear")?.addEventListener("mousedown",ev=>{ev.preventDefault();const [ppk,iid]=state.openDropdown.split("-");selectIngredient(ppk,iid,"");});
        list.querySelector("#dd-add-custom")?.addEventListener("mousedown",ev=>{ev.preventDefault();const [ppk,iid]=state.openDropdown.split("-");selectIngredient(ppk,iid,state.ddSearch.trim());});
      });
      setTimeout(()=>document.getElementById("dd-search-input")?.focus(),80);
    }
    document.getElementById("dd-clear")?.addEventListener("mousedown",e=>{e.preventDefault();const [pk,id]=state.openDropdown.split("-");selectIngredient(pk,id,"");});
    document.querySelectorAll(".dd-item").forEach(el=>{
      const sel=()=>{const [pk,id]=state.openDropdown.split("-");selectIngredient(pk,id,el.dataset.ingname);};
      el.addEventListener("mousedown",e=>{e.preventDefault();sel();});
      el.addEventListener("touchend",e=>{e.preventDefault();sel();});
    });
    document.getElementById("dd-add-custom")?.addEventListener("mousedown",e=>{e.preventDefault();const [pk,id]=state.openDropdown.split("-");selectIngredient(pk,id,state.ddSearch.trim());});
  }
  // Close DD outside
  document.addEventListener("mousedown",function(e){
    if(state.openDropdown&&!e.target.closest("#dd-panel")&&!e.target.closest(".dd-trigger"))closeDD();
  });
  // Library
  document.getElementById("lib-overlay")?.addEventListener("mousedown",e=>{if(e.target.id==="lib-overlay"){state.showLibrary=false;render();}});
  document.getElementById("lib-close")?.addEventListener("click",()=>{state.showLibrary=false;render();});

  // lib-search — no render while typing
  const libSearchEl=document.getElementById("lib-search");
  if(libSearchEl){
    libSearchEl.addEventListener("input",e=>{state.libSearch=e.target.value;});
    libSearchEl.addEventListener("blur",()=>render());
    libSearchEl.addEventListener("keydown",e=>{if(e.key==="Enter") e.target.blur();});
    // Restore cursor position after render
    const pos=libSearchEl.selectionStart;
    libSearchEl.setSelectionRange(pos,pos);
  }

  document.querySelectorAll("[data-libtab]").forEach(el=>el.addEventListener("click",e=>{state.libTab=e.currentTarget.dataset.libtab;state.libSearch="";render();}));
  document.getElementById("lib-add-btn")?.addEventListener("click",()=>{state.libAdding=true;render();});
  document.getElementById("lib-cancel")?.addEventListener("click",()=>{state.libAdding=false;state.libNewName="";state.libNewNote="";render();});
  document.getElementById("lib-confirm")?.addEventListener("click",addToLibrary);

  // lib-new-name — no render while typing
  const libNameEl=document.getElementById("lib-new-name");
  if(libNameEl){
    libNameEl.addEventListener("input",e=>{state.libNewName=e.target.value;});
    libNameEl.addEventListener("keydown",e=>{if(e.key==="Enter") document.getElementById("lib-new-note")?.focus();});
  }
  // lib-new-note — no render while typing
  const libNoteEl=document.getElementById("lib-new-note");
  if(libNoteEl){
    libNoteEl.addEventListener("input",e=>{state.libNewNote=e.target.value;});
    libNoteEl.addEventListener("keydown",e=>{if(e.key==="Enter") addToLibrary();});
  }

  document.getElementById("lib-new-phase")?.addEventListener("change",e=>{state.libNewPhase=e.target.value;});
  document.querySelectorAll(".del-lib-btn").forEach(el=>el.addEventListener("click",e=>deleteFromLibrary(e.currentTarget.dataset.libphase,e.currentTarget.dataset.libname)));
  // Custom formula modal
  document.getElementById("custom-overlay")?.addEventListener("mousedown",e=>{if(e.target.id==="custom-overlay"){state.showCustomModal=false;render();}});
  document.getElementById("custom-close")?.addEventListener("click",()=>{state.showCustomModal=false;render();});
  document.getElementById("custom-with-water")?.addEventListener("click",()=>{state.customHasWater=true;render();});
  document.getElementById("custom-no-water")?.addEventListener("click",()=>{state.customHasWater=false;render();});
  ["AQUEUSE","HUILEUSE","REFROIDISSEMENT"].forEach(k=>{
    document.getElementById(`custom-phase-${k}`)?.addEventListener("click",()=>{state.customPhases[k]=!state.customPhases[k];render();});
  });
  document.getElementById("custom-apply")?.addEventListener("click",applyCustomFormula);
  document.getElementById("saved-close")?.addEventListener("click",()=>{state.showSaved=false;render();});
  document.getElementById("btn-save-from-modal")?.addEventListener("click",saveCurrentFormula);
  document.querySelectorAll(".btn-load").forEach(el=>el.addEventListener("click",e=>loadFormula(parseInt(e.currentTarget.dataset.loadid))));
  document.querySelectorAll(".btn-del-saved").forEach(el=>el.addEventListener("click",e=>deleteFormula(parseInt(e.currentTarget.dataset.delid))));
}


// ═══════════════════════════════════════════════════════════════
// ACCESS CONTROL
// ═══════════════════════════════════════════════════════════════
const VALID_CODES = ["MMC17E0", "MMC7CFC", "MMCD621", "MMCD409", "MMC6154", "MMC1BBC", "MMC0AE6", "MMCFD15", "MMCFFF8", "MMCE6A3", "MMC6A7E", "MMC8576", "MMCC459", "MMC3923", "MMCCF2B", "MMC6F22", "MMCB9AA", "MMC1B00", "MMC9D3B", "MMC1DD4"];
const STORAGE_KEY = "mmc_access_v1";

function isUnlocked(){
  try{ return localStorage.getItem(STORAGE_KEY)==="1"; }catch(e){return false;}
}
function unlock(){
  try{ localStorage.setItem(STORAGE_KEY,"1"); }catch(e){}
}

function showAccessScreen(){
  document.getElementById("app").style.display="none";
  let screen = document.getElementById("access-screen");
  if(!screen){
    screen = document.createElement("div");
    screen.id = "access-screen";
    screen.className = "access-screen";
    screen.innerHTML = `
      <div class="access-card">
        <div class="access-logo">🧪</div>
        <div class="access-brand">Miss Miracle Cosmetics</div>
        <div class="access-title">The Miracle Lab</div>
        <div class="access-subtitle">Entrez votre code d'accès personnel<br>pour accéder au calculateur</div>
        <div class="access-input-wrap">
          <input class="access-input" id="access-code-input" 
            placeholder="EX: MMC-XXXX" maxlength="8"
            autocomplete="off" autocorrect="off" spellcheck="false"/>
        </div>
        <div class="access-error" id="access-error">❌ Code invalide — vérifiez votre email d'achat</div>
        <button class="access-btn" id="access-btn">✨ Accéder à The Miracle Lab</button>
        <div class="access-hint">
          <span class="access-sparkle">✦</span> 
          Votre code se trouve dans votre email de confirmation d'achat.<br>
          <span class="access-sparkle">✦</span> 
          Support : missmiraclecosmeticssenegal@gmail.com
        </div>
      </div>
    `;
    document.body.appendChild(screen);
  }
  screen.style.display="flex";
  
  // Bind events
  const input = document.getElementById("access-code-input");
  const btn = document.getElementById("access-btn");
  const errEl = document.getElementById("access-error");
  
  input.addEventListener("input", e => {
    e.target.value = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g,"");
    input.classList.remove("error");
    errEl.style.display="none";
  });
  
  input.addEventListener("keydown", e => {
    if(e.key==="Enter") tryUnlock();
  });
  
  btn.addEventListener("click", tryUnlock);
  
  setTimeout(()=>input.focus(), 300);
  
  function tryUnlock(){
    const val = input.value.trim().toUpperCase();
    // Accept with or without dash: MMC1234 or MMCA1B2
    const normalized = val.replace(/-/g,"");
    if(VALID_CODES.includes(normalized)){
      input.classList.add("success");
      input.classList.remove("error");
      btn.textContent = "✅ Accès accordé !";
      btn.style.background = "linear-gradient(135deg,#059669,#047857)";
      btn.style.color = "#fff";
      unlock();
      setTimeout(()=>{
        screen.style.display="none";
        document.getElementById("app").style.display="";
        render();
      }, 800);
    } else {
      input.classList.add("error");
      input.classList.remove("success");
      errEl.style.display="block";
      btn.textContent = "✨ Accéder à The Miracle Lab";
    }
  }
}

// Check on load
if(!isUnlocked()){
  document.addEventListener("DOMContentLoaded", showAccessScreen);
  window.addEventListener("load", ()=>{
    if(!isUnlocked()) showAccessScreen();
  });
}


if(isUnlocked()) render();
</script>
